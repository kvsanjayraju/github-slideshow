<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily UPSC MCQs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Daily UPSC Current Affairs MCQs</h1>
    </header>
    <main>
        <button id="loadMcqsBtn">Load Latest MCQs</button>
        <div id="status-message"></div>
        <div id="mcq-container">
            <!-- MCQs will be loaded here by JavaScript -->
        </div>
    </main>
    <footer>
        <p>UPSC MCQ Generator</p>
        <!-- 
            How to run this application:
            1. Ensure the backend API is running:
               - Navigate to the 'api' directory.
               - Run the Flask app: `python app.py` (or `flask run`)
               - The API should be available at http://localhost:5000
            2. Open this `index.html` file in your web browser.
            3. Click the "Load Latest MCQs" button to fetch and display MCQs.
        -->
    </footer>
    <script src="script.js"></script>
</body>
</html>
